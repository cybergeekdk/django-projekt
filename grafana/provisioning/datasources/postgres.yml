apiVersion: 1
datasources:
  - name: Monitor DB
    uid: monitor-pg
    type: grafana-postgresql-datasource
    access: proxy
    url: db:5432
    user: grafana_ro
    jsonData:
      database: monitor
      sslmode: disable
      postgresVersion: 1600
      timescaledb: false
    secureJsonData:
      password: $GRAFANA_RO_PASSWORD
    editable: false
