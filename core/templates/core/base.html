<!doctype html>
<html lang="da" data-bs-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Serveroverblik{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <script>document.documentElement.dataset.bsTheme = matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";</script>
</head>
<body class="bg-body-tertiary">
<nav class="navbar navbar-expand bg-body border-bottom mb-4">
  <div class="container">
    <a class="navbar-brand fw-semibold" href="{% url 'dashboard' %}">Serveroverblik</a>
    <ul class="navbar-nav me-auto">
      <li class="nav-item"><a class="nav-link" href="{% url 'dashboard' %}">Servere</a></li>
      <li class="nav-item"><a class="nav-link" href="{{ grafana_url }}" target="_blank" rel="noopener">Grafana</a></li>
      {% if user.is_staff %}<li class="nav-item"><a class="nav-link" href="{% url 'admin:index' %}">Admin</a></li>{% endif %}
    </ul>
    {% if user.is_authenticated %}
    <form method="post" action="{% url 'logout' %}" class="d-flex align-items-center gap-2">{% csrf_token %}
      <span class="text-muted small">{{ user.username }}</span>
      <button class="btn btn-sm btn-outline-secondary">Log ud</button>
    </form>{% endif %}
  </div>
</nav>
<main class="container pb-5">{% block content %}{% endblock %}</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body></html>
